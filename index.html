<style>
:root{
  --paper:#F3E3B4; --paper-2:#EAD79C; --white-page:#FAF1D9;
  --ink:#2E2A22; --ink-soft:#6b6152; --stamp:#A6382A; --rule:#d0b988; --gold:#AD8A46;
  --night:#141a2b;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);
  font-family:'Times New Roman','Noto Serif SC',serif;-webkit-tap-highlight-color:transparent;}
.hand{font-family:'Caveat','Zhi Mang Xing',cursive;}
#scene{position:fixed;inset:0;touch-action:none;}
#scene canvas{display:block;width:100%;height:100%;outline:none;}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:16px 22px;pointer-events:none;}
.topbar > *{pointer-events:auto;}
.brand{font-family:'Caveat','Zhi Mang Xing',cursive;font-size:26px;color:#F6E7C4;text-shadow:0 2px 10px rgba(0,0,0,.45);}
.top-actions{display:flex;gap:10px;align-items:center;}
.lang-toggle{display:flex;gap:2px;background:rgba(250,241,217,.92);border:1px solid var(--rule);border-radius:999px;padding:3px;}
.lang-toggle button{border:none;background:transparent;padding:6px 14px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink-soft);}
.lang-toggle button.active{background:var(--stamp);color:#fff;}
.chip-btn{border:1px solid var(--rule);background:rgba(250,241,217,.92);color:var(--ink-soft);border-radius:999px;
  height:34px;padding:0 14px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}

/* hover label */
#tip{position:fixed;z-index:15;pointer-events:none;padding:6px 12px;border-radius:999px;
  background:rgba(250,241,217,.95);border:1px solid var(--gold);color:var(--ink);font-size:13px;
  transform:translate(-50%,-150%);white-space:nowrap;opacity:0;transition:opacity .15s;box-shadow:0 6px 18px rgba(0,0,0,.25);}
#tip.show{opacity:1;}
#tip b{font-family:'Caveat','Zhi Mang Xing',cursive;font-size:17px;color:var(--stamp);font-weight:400;margin-right:4px;}

/* speech bubble over the chibi / cat */
#say{position:fixed;z-index:14;pointer-events:none;max-width:min(260px,70vw);padding:9px 14px;border-radius:16px;
  background:#FFFDF6;border:1.5px solid #D2B574;color:var(--ink);font-size:13.5px;line-height:1.5;
  transform:translate(-50%,calc(-100% - 12px)) scale(.9);transform-origin:50% 100%;opacity:0;transition:opacity .2s, transform .2s;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.45);}
#say::after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#FFFDF6;
  border-right:1.5px solid #D2B574;border-bottom:1.5px solid #D2B574;transform:translateX(-50%) rotate(45deg);}
#say.show{opacity:1;transform:translate(-50%,calc(-100% - 12px)) scale(1);}

/* hint + dock */
#hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:10;color:#F6E7C4;font-size:13px;
  text-shadow:0 1px 8px rgba(0,0,0,.6);opacity:.9;white-space:nowrap;transition:opacity .6s;pointer-events:none;}
#dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;gap:6px;
  background:rgba(250,241,217,.9);border:1px solid var(--rule);border-radius:18px;padding:6px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;}
#dock::-webkit-scrollbar{display:none;}
#dock button{border:none;background:transparent;border-radius:12px;padding:6px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink-soft);min-width:62px;}
#dock button:hover,#dock button:focus-visible{background:var(--paper-2);color:var(--ink);outline:none;}
#dock .ic{font-size:20px;line-height:1.1;}
#dock .lb{font-size:11.5px;white-space:nowrap;}

#viewBack{position:fixed;left:50%;bottom:92px;transform:translate(-50%,8px);z-index:21;opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:6px;height:38px;padding:0 18px;border:none;border-radius:999px;background:var(--stamp);color:#fff;
  font:inherit;font-size:14px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);transition:opacity .25s, transform .25s;}
#viewBack.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
@media(max-width:640px){#viewBack{bottom:86px;}}

/* lyrics that float above the room */
#lyrics{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:12;text-align:center;pointer-events:none;
  width:min(720px,92vw);opacity:0;transition:opacity .5s;}
#lyrics.show{opacity:1;}
#lyrics .l1{font-size:clamp(17px,2.4vw,24px);color:#FFF4DA;text-shadow:0 0 14px rgba(255,190,110,.75),0 2px 8px rgba(0,0,0,.6);
  transition:opacity .35s, transform .35s;}
#lyrics .l2{font-size:clamp(13px,1.7vw,16px);color:#F3DDB0;margin-top:4px;text-shadow:0 2px 8px rgba(0,0,0,.6);transition:opacity .35s;}
#lyrics .swap{opacity:0;transform:translateY(-8px);}
#nowPlaying{display:none;}
#nowPlaying.on{display:flex;}

/* loading */
#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
  background:var(--night);color:#F6E7C4;transition:opacity .8s;}
#loading.done{opacity:0;pointer-events:none;}
#loading .big{font-family:'Caveat','Zhi Mang Xing',cursive;font-size:30px;}
#loading .bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;}
#loading .bar i{display:block;height:100%;width:30%;background:#F3C98B;animation:load 1.2s ease-in-out infinite;}
@keyframes load{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
#loading .err{max-width:320px;text-align:center;font-size:13px;opacity:.85;display:none;}

/* generic panel */
.veil{position:fixed;inset:0;z-index:30;background:rgba(15,12,8,.45);display:flex;align-items:center;justify-content:center;
  padding:16px;opacity:0;pointer-events:none;transition:opacity .3s;}
.veil.show{opacity:1;pointer-events:auto;}
.panel{position:relative;width:min(820px,100%);max-height:min(86vh,760px);overflow:auto;background:var(--white-page);
  border-radius:16px;padding:30px 30px 26px;box-shadow:0 30px 70px rgba(0,0,0,.45);
  transform:translateY(14px) scale(.98);transition:transform .3s;}
.veil.show .panel{transform:none;}
.panel h2{font-family:'Caveat','Zhi Mang Xing',cursive;font-weight:400;font-size:clamp(30px,4vw,40px);margin:0 0 2px;}
.panel .sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;padding-bottom:14px;margin-bottom:18px;border-bottom:1px dashed var(--rule);}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);
  background:#fff;color:var(--ink-soft);font-size:18px;cursor:pointer;}
.x:hover{color:var(--stamp);}
.panel.can-drag{cursor:grab;}
.panel.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none;}
.panel.dragging *{pointer-events:none;}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.flip{perspective:900px;height:210px;cursor:pointer;border:none;background:none;padding:0;font:inherit;text-align:left;}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.3,1);transform-style:preserve-3d;}
.flip.on .in{transform:rotateY(180deg);}
@media(hover:hover){.flip:hover .in{transform:rotateY(180deg);}}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--rule);box-shadow:0 8px 20px -12px rgba(60,45,20,.5);overflow:hidden;}
.flip .f{background:var(--paper-2);display:flex;flex-direction:column;justify-content:flex-end;}
.flip .f img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.flip .f .cap{position:relative;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(30,20,10,.72));color:#fff;}
.flip .f .cap b{display:block;font-size:15px;}
.flip .f .cap span{font-size:12px;opacity:.9;}
.flip .f.plain{justify-content:space-between;padding:18px;}
.flip .f.plain .t{font-family:'Caveat','Zhi Mang Xing',cursive;font-size:24px;color:var(--ink);}
.flip .b{background:#fff;transform:rotateY(180deg);padding:18px;display:flex;flex-direction:column;gap:8px;}
.flip .b .t{font-weight:600;font-size:15px;}
.flip .b .d{font-size:13px;line-height:1.7;color:#3f3a30;flex:1;}
.pill{display:inline-block;font-size:11px;color:var(--stamp);border:1px solid var(--stamp);border-radius:999px;padding:2px 9px;}
.mini-btn{align-self:flex-start;font:inherit;font-size:12px;border:1px solid var(--stamp);color:#fff;background:var(--stamp);
  border-radius:999px;padding:4px 12px;cursor:pointer;text-decoration:none;}

/* photo wall */
.pwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;}
.pola{background:#fff;padding:7px 7px 9px;box-shadow:0 6px 14px rgba(0,0,0,.16);transform:rotate(var(--r,0deg));
  cursor:zoom-in;border:none;font:inherit;transition:transform .2s;}
.pola:hover{transform:rotate(0) scale(1.04);}
.pola img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:var(--pos,50% 35%);}

/* news */
.news{display:grid;grid-template-columns:1fr;gap:14px;}
.news .src{font-size:12.5px;color:var(--ink-soft);}
.news h3{font-size:20px;line-height:1.5;margin:0;}
.news p{font-size:14px;line-height:1.8;color:#3f3a30;margin:0;}

/* music */
.tracks{display:grid;gap:12px;}
.track{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:#fff;}
.track .disc{width:48px;height:48px;border-radius:50%;flex:0 0 48px;
  background:radial-gradient(circle,#A6382A 0 22%,#1c1814 23% 100%);box-shadow:inset 0 0 0 6px #2a241e;}
.track.playing .disc{animation:spin 2.4s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.track .meta{flex:1;min-width:0;}
.track .meta b{display:block;font-size:15px;}
.track .meta span{font-size:12.5px;color:var(--ink-soft);}
.track .play{width:40px;height:40px;border-radius:50%;border:none;background:var(--stamp);color:#fff;font-size:15px;cursor:pointer;flex:0 0 40px;}
.music-note{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin-top:14px;}
.music-note code{background:var(--paper-2);padding:1px 6px;border-radius:5px;font-size:12px;}
.warn{color:var(--stamp);}

/* image viewer */
#viewer{z-index:40;background:rgba(15,12,8,.85);}
#viewer img{max-width:min(92vw,1000px);max-height:84vh;background:#fff;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
#viewer .vcap{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;}
#viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.25);color:#fff;font-size:24px;cursor:pointer;}
#viewer .vprev{left:14px;} #viewer .vnext{right:14px;}
#viewer .x{background:rgba(255,255,255,.9);}

/* notebook overlay */
#nb{position:fixed;inset:0;z-index:35;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .45s;}
#nb.show{opacity:1;pointer-events:auto;}
#nb iframe{border:0;width:100%;height:100%;display:block;}
#nbBack{position:fixed;top:14px;right:18px;z-index:36;display:none;}
#nbBack{display:none !important;}

@media(max-width:640px){
  .brand{font-size:21px;}
  .topbar{padding:12px 14px;}
  #hint{bottom:86px;font-size:12px;}
  #dock button{min-width:54px;padding:6px 6px;}
  .panel{padding:24px 18px 20px;}
  .flip{height:190px;}
  #nbBack{top:auto;bottom:18px;right:50%;transform:translateX(50%);}
}
@media(prefers-reduced-motion:reduce){.flip .in{transition:none;}}
</style>
</head>

/* ---------------- textures ---------------- */
function woodPlanks(ctx,w,h){
  const rows=8, rh=h/rows;
  for(let r=0;r<rows;r++){
    let x = -(r%2)*w*0.35;
    while(x<w){
      const len=w*rand(0.35,0.6), l=rand(34,44);
      ctx.fillStyle=`hsl(26,${rand(38,48)}%,${l}%)`; ctx.fillRect(x,r*rh,len,rh);
      ctx.strokeStyle='rgba(60,35,20,.18)'; ctx.lineWidth=1;
      for(let g=0;g<5;g++){ const y=r*rh+rand(4,rh-4); ctx.beginPath(); ctx.moveTo(x,y); ctx.bezierCurveTo(x+len*.3,y+rand(-3,3),x+len*.6,y+rand(-3,3),x+len,y); ctx.stroke(); }
      ctx.fillStyle='rgba(40,22,12,.55)'; ctx.fillRect(x,r*rh,2,rh);
      x+=len;
    }
    ctx.fillStyle='rgba(40,22,12,.5)'; ctx.fillRect(0,r*rh,w,2);
  }
}
function logWall(ctx,w,h){
  const logs=10, lh=h/logs;
  for(let i=0;i<logs;i++){
    const g=ctx.createLinearGradient(0,i*lh,0,(i+1)*lh), base=rand(30,36);
    g.addColorStop(0,`hsl(28,40%,${base-8}%)`); g.addColorStop(.25,`hsl(28,42%,${base+6}%)`);
    g.addColorStop(.7,`hsl(28,40%,${base}%)`); g.addColorStop(1,`hsl(26,40%,${base-12}%)`);
    ctx.fillStyle=g; ctx.fillRect(0,i*lh,w,lh);
    ctx.strokeStyle='rgba(50,28,14,.15)';
    for(let k=0;k<6;k++){ const y=i*lh+rand(6,lh-6); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y+rand(-2,2)); ctx.stroke(); }
  }
}
const nightTex = tex(512,512,(c,w,h)=>{

  c.fillStyle=g; c.fillRect(0,0,w,h);
  for(let i=0;i<180;i++){ c.fillStyle=`rgba(255,255,255,${rand(.25,.9)})`; const s=rand(.6,1.8); c.fillRect(rand(0,w),rand(0,h*.7),s,s); }
});
const flakeTex = tex(64,64,(c)=>{ const g=c.createRadialGradient(32,32,0,32,32,32);

const starTex = tex(64,64,(c)=>{ c.translate(32,32); const g=c.createRadialGradient(0,0,0,0,0,30);
  g.addColorStop(0,'rgba(255,240,200,1)'); g.addColorStop(.3,'rgba(255,210,140,.55)'); g.addColorStop(1,'rgba(255,200,120,0)');
  c.fillStyle=g; c.beginPath(); for(let i=0;i<8;i++){ const r=i%2?7:30, a=i*Math.PI/4; c.lineTo(Math.sin(a)*r,-Math.cos(a)*r);} c.closePath(); c.fill(); });

const interactive = {};   // key -> {group, meshes:[], focus:{pos,target}}
function register(key, group, focus){
  const meshes=[]; group.traverse(o=>{ if(o.isMesh){ o.material = Array.isArray(o.material) ? o.material.map(m=>m.clone()) : o.material.clone(); o.userData.key=key; meshes.push(o);} });
  interactive[key]={group, meshes, focus};
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:starTex, transparent:true, depthWrite:false, opacity:.9}));
  s.scale.setScalar(0.16); s.userData.base=null; s.userData.key=key; hintScene.add(s); interactive[key].sparkle=s;
}

/* room geometry: inner left wall x=-4, back wall z=-4, gable roof with ridge at x=0.25 */
const EAVE = 3.0, RIDGE_X = 0.25, RIDGE_Y = 5.25, ROOM_Z0 = -4.25, ROOM_Z1 = 3.65;
const SLOPE = Math.atan2(RIDGE_Y - EAVE, RIDGE_X + 4.25);           // roof pitch
const SLOPE_LEN = Math.hypot(RIDGE_Y - EAVE, RIDGE_X + 4.25);

// sit an object on a surface: its lowest point lands at y
function placeOn(obj, x, y, z, rotY=0, s=1){
  obj.scale.setScalar(s); obj.rotation.y = rotY; obj.position.set(0,0,0); obj.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(obj);
  obj.position.set(x, y - b.min.y, z);
  scene.add(obj); return obj;
}
// all upward-facing surfaces under (x,z) of a target, highest first
function surfacesAt(target, x, z, fromY=4){
  target.updateMatrixWorld(true);
  const r = new THREE.Raycaster(new THREE.Vector3(x,fromY,z), new THREE.Vector3(0,-1,0));
  return r.intersectObject(target, true)
    .filter(h=>h.face && h.face.normal.clone().transformDirection(h.object.matrixWorld).y > 0.6)
    .map(h=>h.point.y);
}
function prepModel(root, {cast=true, recv=true}={}){
  root.traverse(o=>{ if(o.isMesh){ o.castShadow = cast && !MOBILE; o.receiveShadow = recv;
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach(m=>{ if(m.map) m.map.anisotropy = 4; }); } });
  return root;
}
const models = {};
function loadModel(name){
  return new Promise(res=>gltfLoader.load(`assets/models/${name}.glb`, g=>{ models[name]=prepModel(g.scene); res(g.scene); }, undefined, ()=>res(null)));
}
function retexture(root, url){
  const t = loader.load(url); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  root.traverse(o=>{ if(o.isMesh){ const ms = Array.isArray(o.material)?o.material:[o.material];
    ms.forEach(m=>{ if(m.map){ m.map = t; m.needsUpdate = true; } }); } });
}

function planksTex(ctx,w,h){   // tongue-and-groove ceiling boards
  const n=16, bw=w/n;
  for(let i=0;i<n;i++){ ctx.fillStyle=`hsl(30,${rand(30,38)}%,${rand(48,56)}%)`; ctx.fillRect(i*bw,0,bw,h);
    ctx.strokeStyle='rgba(80,50,30,.12)'; for(let g=0;g<6;g++){ const x=i*bw+rand(3,bw-3); ctx.beginPath(); ctx.moveTo(x,0); ctx.bezierCurveTo(x+rand(-3,3),h*.3,x+rand(-3,3),h*.6,x,h); ctx.stroke(); }
    ctx.fillStyle='rgba(50,30,18,.55)'; ctx.fillRect(i*bw,0,2,h); ctx.fillStyle='rgba(255,240,220,.15)'; ctx.fillRect(i*bw+2,0,1,h); }
}
function noiseNormalTex(size, strength){   // soft bumpy normal map for snow
  return tex(size,size,(c,w,h)=>{ const d=c.createImageData(w,h); const hgt=new Float32Array(w*h);
    for(let o=0;o<4;o++){ const f=2**(o+2); for(let y=0;y<h;y++) for(let x=0;x<w;x++)
      hgt[y*w+x]+=Math.sin(x/w*Math.PI*2*f+o*1.7+Math.sin(y/h*6.28*f*0.5)*1.3)*Math.cos(y/h*Math.PI*2*f+o)/(o+1); }
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x, dx=hgt[y*w+(x+1)%w]-hgt[i], dy=hgt[((y+1)%h)*w+x]-hgt[i];
      d.data[i*4]=128-dx*strength; d.data[i*4+1]=128-dy*strength; d.data[i*4+2]=255; d.data[i*4+3]=255; }
    c.putImageData(d,0,0); });
}

function buildRoom(){
  /* ---------- shell ---------- */
  const ft = tex(1024,1024,woodPlanks); ft.wrapS=ft.wrapT=THREE.RepeatWrapping; ft.repeat.set(2.2,2.2);
  scene.add(mesh(new THREE.PlaneGeometry(9,7.9), mat(0xffffff,{r:.7,extra:{map:ft}}), {pos:[0.25,0,-0.3], rot:[-Math.PI/2,0,0], cast:false}));

  const wt = tex(1024,1024,logWall); wt.wrapS=wt.wrapT=THREE.RepeatWrapping; wt.repeat.set(1.6,1);
  const wallMat = mat(0xffffff,{extra:{map:wt}});
  // back wall is the gable end, with the window cut out
  const shape = new THREE.Shape();
  shape.moveTo(-4.25,0); shape.lineTo(4.75,0); shape.lineTo(4.75,EAVE); shape.lineTo(RIDGE_X,RIDGE_Y); shape.lineTo(-4.25,EAVE); shape.closePath();
  const hole = new THREE.Path(); hole.moveTo(-1.75,1.35); hole.lineTo(0.15,1.35); hole.lineTo(0.15,2.9); hole.lineTo(-1.75,2.9); hole.closePath();
  shape.holes.push(hole);
  const bw = new THREE.ExtrudeGeometry(shape,{depth:0.25,bevelEnabled:false});
  const uv = bw.attributes.uv; for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)/4.5, uv.getY(i)/4);
  scene.add(mesh(bw, wallMat, {pos:[0,0,-4.25]}));
  const lwt = wt.clone(); lwt.repeat.set(1.7,0.75); lwt.needsUpdate = true;
  scene.add(mesh(new THREE.BoxGeometry(0.25,EAVE,ROOM_Z1-ROOM_Z0), mat(0xffffff,{extra:{map:lwt}}), {pos:[-4.125,EAVE/2,(ROOM_Z0+ROOM_Z1)/2]}));
  // right wall + front gable: single-sided, so they close the room from inside
  // but vanish when the overview camera sits outside them
  const inWall = (w,h)=>{ const t2 = wt.clone(); t2.repeat.set(w/4.5*1.6, h/4); t2.needsUpdate = true;
    return new THREE.MeshStandardMaterial({map:t2, roughness:.85, side:THREE.FrontSide}); };
  scene.add(mesh(new THREE.PlaneGeometry(ROOM_Z1-ROOM_Z0, EAVE), inWall(ROOM_Z1-ROOM_Z0, EAVE), {pos:[4.75,EAVE/2,(ROOM_Z0+ROOM_Z1)/2], rot:[0,-Math.PI/2,0], cast:false}));
  const fshape = new THREE.Shape(); fshape.moveTo(-4.25,0); fshape.lineTo(4.75,0); fshape.lineTo(4.75,EAVE); fshape.lineTo(RIDGE_X,RIDGE_Y); fshape.lineTo(-4.25,EAVE); fshape.closePath();
  const fg = new THREE.ShapeGeometry(fshape); const fuv = fg.attributes.uv; for(let i=0;i<fuv.count;i++) fuv.setXY(i, fuv.getX(i)/4.5, fuv.getY(i)/4);
  const front = mesh(fg, new THREE.MeshStandardMaterial({map:wt, roughness:.85, side:THREE.BackSide}), {pos:[0,0,ROOM_Z1], cast:false}); scene.add(front);
  const trim = mat(0x5a3a26);
  scene.add(mesh(new THREE.BoxGeometry(9,0.12,0.06), trim, {pos:[0.25,0.06,-3.97]}));
  scene.add(mesh(new THREE.BoxGeometry(0.06,0.12,7.9), trim, {pos:[-3.97,0.06,-0.3]}));

  /* ---------- A-frame roof: boards, rafters, purlins, ridge beam, king-post trusses ---------- */
  const rt = tex(1024,512,planksTex); rt.wrapS=rt.wrapT=THREE.RepeatWrapping; rt.repeat.set(3,1.6);
  const boardMat = mat(0xffffff,{r:.8,extra:{map:rt}});
  const timber = mat(0x5b3b27,{r:.75});
  const depth = ROOM_Z1-ROOM_Z0, zc = (ROOM_Z0+ROOM_Z1)/2;
  [-1,1].forEach(side=>{
    const cx = side<0 ? (-4.25+RIDGE_X)/2 : (RIDGE_X+4.75)/2, cy = (EAVE+RIDGE_Y)/2, rz = side<0 ? SLOPE : -SLOPE;
    const n = new THREE.Vector3(side<0 ? Math.sin(SLOPE) : -Math.sin(SLOPE), -Math.cos(SLOPE), 0);   // points into the room
    scene.add(mesh(new THREE.BoxGeometry(SLOPE_LEN+0.3,0.06,depth), boardMat, {pos:[cx,cy,zc], rot:[0,0,rz], cast:false}));
    for(let z=ROOM_Z0+0.35; z<ROOM_Z1; z+=0.7){
      const p = new THREE.Vector3(cx,cy,z).addScaledVector(n,0.11);
      scene.add(mesh(new THREE.BoxGeometry(SLOPE_LEN+0.2,0.16,0.09), timber, {pos:[p.x,p.y,p.z], rot:[0,0,rz], cast:false}));
    }
    const pp = new THREE.Vector3(cx,cy,zc).addScaledVector(n,0.27);
    scene.add(mesh(new THREE.BoxGeometry(0.16,0.16,depth), timber, {pos:[pp.x,pp.y,pp.z], rot:[0,0,rz], cast:false}));
  });
  scene.add(mesh(new THREE.BoxGeometry(0.24,0.3,depth), timber, {pos:[RIDGE_X,RIDGE_Y-0.2,zc], cast:false}));
  [-1.4].forEach(z=>{
    scene.add(mesh(new THREE.BoxGeometry(8.9,0.2,0.18), timber, {pos:[RIDGE_X,EAVE,z], cast:false}));            // tie beam
    scene.add(mesh(new THREE.BoxGeometry(0.16,RIDGE_Y-EAVE-0.3,0.16), timber, {pos:[RIDGE_X,(EAVE+RIDGE_Y-0.3)/2,z], cast:false}));  // king post
    [-1,1].forEach(s=>{ const len=Math.hypot(1.6,1.0);
      scene.add(mesh(new THREE.BoxGeometry(len,0.12,0.12), timber, {pos:[RIDGE_X+s*0.8,EAVE+0.55,z], rot:[0,0,s*Math.atan2(1.0,1.6)], cast:false})); });
  });

  /* ---------- window: frame sits proud of the wall (no z-fighting), frost + sill snow ---------- */
  const fr = mat(0xEDE3CF,{r:.6});
  const W=[-1.75,0.15], H=[1.35,2.9], cx=(W[0]+W[1])/2, cy=(H[0]+H[1])/2, ww=W[1]-W[0], wh=H[1]-H[0];
  const FZ = -4.03;
  scene.add(mesh(new THREE.BoxGeometry(ww+0.24,0.12,0.36),fr,{pos:[cx,H[1]+0.04,FZ]}));
  scene.add(mesh(new THREE.BoxGeometry(ww+0.24,0.12,0.36),fr,{pos:[cx,H[0]-0.04,FZ]}));
  scene.add(mesh(new THREE.BoxGeometry(0.12,wh+0.2,0.36),fr,{pos:[W[0]+0.04,cy,FZ]}));
  scene.add(mesh(new THREE.BoxGeometry(0.12,wh+0.2,0.36),fr,{pos:[W[1]-0.04,cy,FZ]}));
  scene.add(mesh(new THREE.BoxGeometry(0.05,wh,0.06),fr,{pos:[cx,cy,-4.12]}));
  scene.add(mesh(new THREE.BoxGeometry(ww,0.05,0.06),fr,{pos:[cx,cy,-4.12]}));
  scene.add(mesh(new THREE.BoxGeometry(ww+0.44,0.06,0.3),fr,{pos:[cx,H[0]-0.13,-3.84]}));
  // frost only creeps in from the bottom corners, very faint
  const frostTex = tex(256,256,(c,w,h)=>{
    [[0,h],[w,h]].forEach(([x,y])=>{ const g=c.createRadialGradient(x,y,0,x,y,w*.55); g.addColorStop(0,'rgba(240,246,255,.5)'); g.addColorStop(.5,'rgba(240,246,255,.12)'); g.addColorStop(1,'rgba(240,246,255,0)'); c.fillStyle=g; c.fillRect(0,0,w,h); });
    const e=c.createLinearGradient(0,h,0,h*.8); e.addColorStop(0,'rgba(245,248,255,.35)'); e.addColorStop(1,'rgba(245,248,255,0)'); c.fillStyle=e; c.fillRect(0,h*.8,w,h*.2); });
  const glassMat = new THREE.MeshStandardMaterial({color:0xcfdcff, transparent:true, opacity:0.08, roughness:0.05, metalness:0, depthWrite:false});
  const frostMat = new THREE.MeshBasicMaterial({map:frostTex, transparent:true, depthWrite:false});
  [[cx-ww/4,cy+wh/4],[cx+ww/4,cy+wh/4],[cx-ww/4,cy-wh/4],[cx+ww/4,cy-wh/4]].forEach(([x,y])=>{
    scene.add(mesh(new THREE.PlaneGeometry(ww/2-0.03,wh/2-0.03), glassMat, {pos:[x,y,-4.14], cast:false, recv:false}));
    scene.add(mesh(new THREE.PlaneGeometry(ww/2-0.03,wh/2-0.03), frostMat, {pos:[x,y,-4.135], cast:false, recv:false}));
  });
  const snowMat = new THREE.MeshStandardMaterial({color:0xF7FAFF, roughness:.9});

function furry(geo, map, {len=.02, layers=MOBILE?9:16, rep=[14,8], droop=.35, base=0xffffff}={}){

  const core = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({map:vc?null:map, vertexColors:vc, color:new THREE.Color(base).multiplyScalar(.55), roughness:1}));
  core.castShadow = !MOBILE; core.receiveShadow = true; g.add(core);
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  for(let i=1;i<=layers;i++){
    const k = i/layers, sg = geo.clone(), sp = sg.attributes.position;
    for(let j=0;j<sp.count;j++){ sp.setXYZ(j, pos.getX(j)+nor.getX(j)*len*k, pos.getY(j)+nor.getY(j)*len*k - droop*len*k*k, pos.getZ(j)+nor.getZ(j)*len*k); }

}

const ZONE_TXT = {
  zh:{desk:'走近书桌',window:'看看窗外的雪',shelf:'看看书架',photos:'走近照片墙',awards:'走近奖状墙',nook:'沙发角落',bed:'床边',lounge:'沙发与摇椅'},

function zoneAt(p){
  if(p.y > 3.05) return null;                                       // roof
  if(p.x < -3.85) return p.z > 0.3 ? 'bed' : 'photos';              // left wall
  if(p.z < -3.85) return p.x < -2.1 ? 'shelf' : p.x < 0.35 ? (p.y > 1.3 ? 'window' : 'desk') : 'awards';   // back wall
  if(p.z < -2.55) return p.x < -2.1 ? 'shelf' : p.x < 0.5 ? 'desk' : 'awards';
  if(p.x < -1.2) return p.z > 0.45 ? 'bed' : 'nook';
  if(p.x > 0.7 && p.z < 0.3) return 'lounge';
  return null;
}
function pickSpecial(e){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((e.clientX-r.left)/r.width)*2-1; ptr.y = -((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(specials, false)[0];
  return hit ? hit.object.userData.special : null;
}
function pickZone(e){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((e.clientX-r.left)/r.width)*2-1; ptr.y = -((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h=>h.object.isMesh && h.object.visible);
  return hit ? zoneAt(hit.point) : null;
}
let viewing = null, overview = null;
const viewBack = document.getElementById('viewBack');
async function goView(z){
  if(busy || viewing===z) return;
  busy = true; setHover(null); tip.classList.remove('show'); hideHint();
  if(!viewing) overview = {pos:camera.position.clone(), target:controls.target.clone()};
  controls.enabled = false; viewing = z; viewBack.classList.add('show');
  await flyTo(new THREE.Vector3(...VIEWS[z].pos), new THREE.Vector3(...VIEWS[z].tgt));
  busy = false;
}
async function leaveView(){
  if(!viewing || busy) return;
  busy = true; viewing = null; viewBack.classList.remove('show');
  await flyTo(overview.pos, overview.target, 850);
  controls.enabled = true; busy = false; overview = null;
}
viewBack.addEventListener('click', leaveView);

let lastMove = 0;
renderer.domElement.addEventListener('pointermove', e=>{
  if(busy || e.pointerType==='touch') return;
  const key = pick(e);
  setHover(key);
  if(key){ const [n,d]=T[lang].objects[key]; tip.innerHTML=`<b>${n}</b>${d}`; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.classList.add('show'); return; }
  const now = performance.now(); if(now - lastMove < 90) return; lastMove = now;
  const sp = pickSpecial(e);
  if(sp){ renderer.domElement.style.cursor='pointer'; tip.innerHTML = lang==='zh'?'🐾 摸摸小猫':'🐾 Pet the cat';
    tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.classList.add('show'); return; }
  const z = pickZone(e);
  if(z && z!==viewing){ renderer.domElement.style.cursor='zoom-in'; tip.innerHTML=`🔍 ${ZONE_TXT[lang][z]}`; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.classList.add('show'); }
  else tip.classList.remove('show');
});
renderer.domElement.addEventListener('pointerdown', e=>{ downAt = {x:e.clientX, y:e.clientY}; hideHint(); });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downAt || busy) return;
  const moved = Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y); downAt = null;
  if(moved > 6) return;
  const key = pick(e); if(key) return activate(key);
  const sp = pickSpecial(e); if(sp==='cat') return pokeCat();
  const z = pickZone(e); if(z) goView(z);
});
renderer.domElement.addEventListener('pointerleave', ()=>{ setHover(null); tip.classList.remove('show'); });

/* camera flights */
let fly = null;
const ease = k=>k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
function flyTo(pos, target, ms=950){
  if(REDUCED) ms = 1;
  return new Promise(res=>{ fly = {p0:camera.position.clone(), t0:controls.target.clone(), p1:pos.clone(), t1:target.clone(), s:performance.now(), ms, res}; });
}
function focusOf(key){
  const o = interactive[key], f = o.focus;
  const c = new THREE.Vector3();
  if(f.center) c.set(...f.center); else o.group.getWorldPosition(c);
  if(f.look) c.add(new THREE.Vector3(...f.look));
  const p = f.camAbs ? new THREE.Vector3(...f.camAbs) : c.clone().add(new THREE.Vector3(...f.off));
  return {pos:p, target:c};
}
async function activate(key){
  if(busy) return; busy = true; setHover(null); hideHint();
  homeView = {pos:camera.position.clone(), target:controls.target.clone()};
  controls.enabled = false;
  const f = focusOf(key);
  sayEl.classList.remove('show');
  await flyTo(f.pos, f.target);
  open(key);
}
async function goHome(){
  if(!homeView){ busy=false; controls.enabled=!viewing; return; }
  await flyTo(homeView.pos, homeView.target, 800);
  controls.enabled = !viewing; busy = false; homeView = null;
}

// grab-and-drag scrolling for mouse users (touch and wheel already scroll natively)
(function(){
  let d = null;
  panel.addEventListener('pointerdown', e=>{
    if(e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('#px, a, audio, input')) return;
    d = {y:e.clientY, top:panel.scrollTop, moved:false, id:e.pointerId};
  });
  panel.addEventListener('pointermove', e=>{
    if(!d) return;
    const dy = e.clientY - d.y;
    if(!d.moved && Math.abs(dy) > 5){ d.moved = true; panel.classList.add('dragging'); panel.setPointerCapture(d.id); }
    if(d.moved){ panel.scrollTop = d.top - dy; e.preventDefault(); }
  });
  const end = ()=>{ if(!d) return;
    if(d.moved){ panel.classList.remove('dragging');
      // swallow only the click that ends this drag, never a later real click
      const eat = ev=>{ ev.stopPropagation(); ev.preventDefault(); };
      panel.addEventListener('click', eat, {capture:true, once:true}); setTimeout(()=>panel.removeEventListener('click', eat, {capture:true}), 0); }
    d = null; };
  panel.addEventListener('pointerup', end); panel.addEventListener('pointercancel', end);
  // wheel/trackpad always scrolls the panel, never the 3D room behind it
  panel.addEventListener('wheel', e=>e.stopPropagation(), {passive:true});
})();

});

const audio = document.getElementById('audio');
const player = {idx:-1, lrc:[], line:-1};
const lyEl = document.getElementById('lyrics'), ly1 = document.getElementById('ly1'), ly2 = document.getElementById('ly2');
const np = document.getElementById('nowPlaying');

function parseLRC(txt){
  const map = new Map();
  txt.split(/\r?\n/).forEach(line=>{
    const tags=[...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)]; if(!tags.length) return;
    const text=line.replace(/\[[^\]]*\]/g,'').trim(); if(!text) return;
    tags.forEach(m=>{ const t=+m[1]*60+ +m[2]; const k=t.toFixed(2); if(!map.has(k)) map.set(k,{t,lines:[]}); map.get(k).lines.push(text); });
  });
  return [...map.values()].sort((a,b)=>a.t-b.t);
}
async function loadTrack(i){
  const t = TRACKS[i]; player.idx = i; player.lrc = []; player.line = -1;
  audio.src = `assets/music/${t.id}.mp3`;
}
async function togglePlay(i){
  document.querySelectorAll('.warn').forEach(w=>w.innerHTML='');
  if(player.idx===i && !audio.paused){ audio.pause(); return syncMusicUI(); }
  if(player.idx!==i) await loadTrack(i);
  try{ await audio.play(); }
  catch(err){ const w=document.getElementById('warn'+i); if(w) w.innerHTML = T[lang].musicMissing(`${TRACKS[i].id}.mp3`); player.idx=-1; }
  syncMusicUI();
}
audio.addEventListener('error', ()=>{ const i=player.idx; if(i<0) return; const w=document.getElementById('warn'+i);
  if(w) w.innerHTML = T[lang].musicMissing(`${TRACKS[i].id}.mp3`); player.idx=-1; syncMusicUI(); });
audio.loop = true;   // one track: let it loop quietly
audio.addEventListener('pause', syncMusicUI); audio.addEventListener('play', syncMusicUI);
function syncMusicUI(){
  const playing = player.idx>=0 && !audio.paused;
  document.querySelectorAll('.track').forEach(el=>{ const i=+el.dataset.tr, on = playing && i===player.idx;
    el.classList.toggle('playing', on); el.querySelector('.play').textContent = on ? '❚❚' : '▶'; });
  np.classList.toggle('on', player.idx>=0);
  if(player.idx>=0){ document.getElementById('npTitle').textContent = trackTitle(TRACKS[player.idx]); document.getElementById('npIcon').textContent = playing ? '❚❚' : '▶'; }
  lyEl.classList.toggle('show', playing);
  if(playing && !player.lrc.length){ ly1.textContent = trackTitle(TRACKS[player.idx])+' · '+(lang==='zh'?'萨蒂':'Erik Satie'); ly2.textContent = T[lang].noLyrics; }
}
np.addEventListener('click', ()=>{ if(player.idx<0) return; audio.paused ? audio.play() : audio.pause(); });
audio.addEventListener('timeupdate', ()=>{
  if(!player.lrc.length) return;
  const t = audio.currentTime; let k = -1;
  for(let i=0;i<player.lrc.length;i++){ if(player.lrc[i].t<=t+0.15) k=i; else break; }
  if(k===player.line) return; player.line = k;
  const cur = k>=0 ? player.lrc[k].lines : ['♪'];
  ly1.classList.add('swap');
  setTimeout(()=>{ ly1.textContent = cur[0]||''; ly2.textContent = cur[1]||''; ly1.classList.remove('swap'); }, 180);
});

/* ---------------- resize + loop ---------------- */
function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w,h,false); composer?.setSize(w,h);
  camera.aspect = w/h; camera.fov = w/h < 0.8 ? 68 : (w/h < 1.2 ? 50 : 42); camera.updateProjectionMatrix();
  const want = w/h < 0.8 ? HOME_TALL : HOME_WIDE;
  if(want !== HOME && !busy) setHome(want);
}
let composer = null;
if(!MOBILE){
  try{
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const ao = new GTAOPass(scene, camera, innerWidth, innerHeight);
    ao.updateGtaoMaterial({radius:0.35, distanceExponent:1.5, thickness:1, scale:1.1, samples:12});
    ao.blendIntensity = 0.85; composer.addPass(ao);
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.55, 0.88));
    composer.addPass(new OutputPass());
  }catch(e){ composer = null; }
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
window.__cabin = {scene, camera, controls, renderer};   // handy for tuning in devtools
function loop(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if(fly){ const k=Math.min(1,(performance.now()-fly.s)/fly.ms), e=ease(k);
    camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); camera.lookAt(controls.target);
    if(k>=1){ const r=fly.res; fly=null; r(); } }
  else if(controls.enabled) controls.update();
  updateChars(t, dt);
  // snow
  (scene.userData.snow||[]).forEach(s=>{ const p=s.geometry.attributes.position, a=p.array, sp=(REDUCED?0.3:0.75)*s.userData.speed;
    for(let i=0;i<p.count;i++){ a[i*3+1]-=dt*sp*(0.6+(i%7)/10); a[i*3]+=(Math.sin(t*.7+i)*0.12+Math.sin(t*.23+i*.5)*0.08)*dt*s.userData.speed; if(a[i*3+1]<0) a[i*3+1]=8; }
    p.needsUpdate=true; });
  if(scene.userData.flame) scene.userData.flame.intensity = 1.3 + Math.sin(t*9)*0.08 + Math.sin(t*23.7)*0.06;
  // twinkling string lights
  (scene.userData.bulbs||[]).forEach(b=>{ const v=0.75+0.25*Math.sin(t*2+b.userData.phase); b.material.color.setRGB(1, 0.72+0.12*v, 0.45*v); });
  // record spins while music plays
  if(scene.userData.vinyl){ const playing = player.idx>=0 && !audio.paused;
    if(playing) scene.userData.vinyl.rotation.y -= dt*3.5;
    const armT = playing ? 0.9 : 0.5; scene.userData.arm.rotation.y += (armT - scene.userData.arm.rotation.y)*Math.min(1,dt*4); }
  // bobbing sparkles over interactive things
  Object.entries(interactive).forEach(([k,o])=>{ const s=o.sparkle; if(!s.userData.base){ const f=focusOf(k); s.userData.base=f.target.clone().add(new THREE.Vector3(0, k==='photos' ? 0.98 : k==='awards' ? 0.72 : 0.28, 0)); if(k==='photos') s.userData.base.x += 0.12; }
    s.position.copy(s.userData.base); if(!REDUCED) s.position.y += Math.sin(t*2+k.length)*0.04;
    s.material.opacity = busy ? 0 : (hovered===k ? 1 : 0.55+0.35*Math.sin(t*3+k.length)); });
  composer ? composer.render() : renderer.render(scene, camera);
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(hintScene, camera); renderer.autoClear = true;
  requestAnimationFrame(loop);
}

    await Promise.race([ Promise.all(['92px "Zhi Mang Xing"','52px Caveat','30px "Noto Serif SC"'].map(f=>document.fonts.load(f,'尚珥骁 Notebook 喜讯'))), new Promise(r=>setTimeout(r,2500)) ]);
  }catch(e){}
  window.__stage='build'; buildRoom(); buildCat(); resize();   /* 2D pose card retired until a real 3D model of me arrives */ window.__stage='loading';
  await Promise.race([ Promise.all([allLoaded, scene.userData.modelsReady]), new Promise(r=>setTimeout(r, 12000)) ]);
  window.__stage='compile';
  // precompile shaders, but never let a slow/odd GPU keep the loading screen up
  try{ await Promise.race([renderer.compileAsync(scene, camera), new Promise(r=>setTimeout(r,2500))]); }catch(e){ renderer.compile(scene, camera); }
  window.__stage='loop'; loop();
  // wait two painted frames — but background tabs pause rAF, so don't wait forever
  await Promise.race([new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))), new Promise(r=>setTimeout(r,600))]); window.__stage='shown';
  document.getElementById('loading').classList.add('done');
  // dev aid: ?cam=x,y,z&look=x,y,z parks the camera (used for screenshots)
  const qs = new URLSearchParams(location.search);
  if(qs.get('cam')){ controls.enabled=false; camera.position.fromArray(qs.get('cam').split(',').map(Number)); controls.target.fromArray((qs.get('look')||'0,1,-2').split(',').map(Number)); camera.lookAt(controls.target); }
  // warm the notebook in the background so opening it feels instant
  const idle = window.requestIdleCallback || (fn=>setTimeout(fn,1500));
  idle(()=>{ if(!nbFrame.src) nbFrame.src = nbSrc(); });
})();
</script>
<script>
  // if the 3D module cannot load (offline / blocked CDN), fall back to the notebook
  setTimeout(()=>{ if(!document.querySelector('#scene canvas')){ const e=document.getElementById('ldErr');
    e.style.display='block'; e.innerHTML='3D 小屋加载失败，<a href="notebook.html" style="color:#F3C98B">直接打开手账简历 →</a>'; } }, 9000);
</script>
