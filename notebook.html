<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尚珥骁 · 个人简历手账本</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/img/thumb/portrait.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/thumb/cam-campus.webp">
<link rel="preload" as="image" href="assets/img/thumb/cam-night.webp">
<link rel="preload" as="image" href="assets/img/thumb/cam-college.webp">
<link rel="preload" as="image" href="assets/img/thumb/cam-gate.webp">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3E3B4;
  --paper-2:#EAD79C;
  --paper-shadow:#D6BD7C;
  --ink:#2E2A22;
  --ink-soft:#6b6152;
  --stamp:#A6382A;
  --stamp-soft:#c15a4a;
  --tape:#8B9A73;
  --tape-2:#c9b896;
  --gold:#AD8A46;
  --rule:#d0b988;
  --white-page:#FAF1D9;
}
*{box-sizing:border-box;}
/* fluid type: ~15px on phones -> 16px on desktop, times the reader's own choice (--fs, set by the Aa slider) */
html{font-size:calc(var(--fs,1) * clamp(15px, 14.1px + 0.15vw, 16px));-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(173,138,70,0.06), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(139,154,115,0.07), transparent 40%);
  font-family:'Times New Roman','Noto Serif SC',serif;
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
.topbar,.notebook-wrap{position:relative;z-index:1;}
.topbar{z-index:5;}   /* keeps the Aa pop-up above the notebook */
.hand{font-family:'Caveat','Zhi Mang Xing',cursive;}
::selection{background:var(--tape);color:#fff;}

/* top bar */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 28px;
  max-width:1180px;margin:0 auto;
}
.brand{
  font-family:'Caveat','Zhi Mang Xing',cursive;
  font-size:1.625rem;color:var(--ink-soft);
}
.lang-toggle{
  display:flex;gap:2px;
  background:var(--paper-2);
  border:1px solid var(--rule);
  border-radius:999px;
  padding:3px;
}
.lang-toggle button{
  border:none;background:transparent;
  padding:6px 14px;border-radius:999px;
  font-family:'Times New Roman','Noto Serif SC',serif;
  font-size:0.8125rem;letter-spacing:.02em;
  cursor:pointer;color:var(--ink-soft);
  transition:background .25s, color .25s;
}
.lang-toggle button.active{
  background:var(--stamp);color:#fff;
}

/* font-size control */
.top-actions{display:flex;align-items:center;gap:10px;}
.fs-ctl{position:relative;}
.fs-btn{
  width:38px;height:34px;border-radius:999px;border:1px solid var(--rule);
  background:var(--paper-2);color:var(--ink-soft);cursor:pointer;
  font-family:'Times New Roman',serif;font-size:0.9375rem;
}
.fs-btn[aria-expanded="true"]{background:var(--stamp);color:#fff;border-color:var(--stamp);}
.fs-pop{
  position:absolute;right:0;top:calc(100% + 8px);z-index:100;
  width:230px;padding:12px 14px;border-radius:12px;
  background:var(--white-page);border:1px solid var(--rule);
  box-shadow:0 12px 28px -12px rgba(60,45,20,.4);
}
.fs-pop[hidden]{display:none;}
.fs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:0.8125rem;color:var(--ink-soft);margin-bottom:8px;}
.fs-row b{color:var(--stamp);font-weight:600;}
.fs-row input{flex:1;accent-color:var(--stamp);}
.fs-a{font-family:'Times New Roman',serif;color:var(--ink-soft);}
.fs-a.sm{font-size:12px;}
.fs-a.lg{font-size:19px;}
.fs-reset{font:inherit;font-size:0.75rem;border:1px solid var(--rule);background:transparent;color:var(--ink-soft);border-radius:999px;padding:3px 12px;cursor:pointer;}

/* notebook shell */
.notebook-wrap{
  max-width:1180px;margin:10px auto 60px;
  padding:0 20px;
  display:flex;gap:0;
}
.spine{
  width:34px;flex:0 0 34px;
  background:linear-gradient(180deg,var(--paper-shadow),var(--paper-2));
  border-radius:14px 0 0 14px;
  position:relative;
  box-shadow:inset -6px 0 10px -6px rgba(0,0,0,.15);
}
.spine::before{
  content:'';
  position:absolute;top:24px;bottom:24px;left:50%;
  width:2px;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,transparent 0 14px, var(--ink-soft) 14px 16px);
  opacity:.35;
}
.ring{
  position:absolute;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;
  border:3px solid var(--ink-soft);
  opacity:.28;background:var(--paper);
}

.book{
  flex:1;position:relative;
  background:var(--white-page);
  border-radius:0 14px 14px 0;
  box-shadow:0 18px 40px -20px rgba(60,45,20,.35), 0 2px 0 var(--paper-shadow);
  min-height:640px;
  display:flex;
}
/* tabs */
.tabs{
  width:88px;flex:0 0 88px;
  display:flex;flex-direction:column;
  padding:56px 0 20px;
  gap:10px;
}
.tab{
  border:none;cursor:pointer;
  padding:12px 6px;
  font-family:'Caveat','Zhi Mang Xing',cursive;
  font-size:1.0625rem;
  writing-mode:vertical-rl;text-orientation:mixed;
  border-radius:8px 0 0 8px;
  background:var(--paper-2);
  color:var(--ink-soft);
  box-shadow: -2px 2px 4px rgba(0,0,0,.06);
  transition:transform .2s, background .2s, color .2s;
  min-height:104px;
}
.tab:hover{transform:translateX(-3px);}
.tab.active{
  background:var(--white-page);
  color:var(--stamp);
  box-shadow: -2px 2px 4px rgba(0,0,0,.1);
  transform:translateX(-6px);
}

/* headings */
h1.page-title{
  font-family:'Caveat','Zhi Mang Xing',cursive;
  font-size:clamp(2.1rem, 1.6rem + 1.9vw, 2.75rem);color:var(--ink);
  margin:0 0 4px;
}
.page-sub{
  font-size:0.8125rem;color:var(--ink-soft);
  letter-spacing:.03em;margin-bottom:26px;
  border-bottom:1px dashed var(--rule);
  padding-bottom:16px;
}

/* cover */
.cover{display:flex;flex-direction:column;gap:28px;}
.cover-collage{
  position:relative;
  width:100%;max-width:680px;
  aspect-ratio:2.2/1;
  margin:0 auto;
}
.collage-item{
  position:absolute;
  width:23%;aspect-ratio:3/4.3;
  padding:6px 6px 16px;
  background:#fff;
  box-shadow:0 6px 16px rgba(60,45,20,.22);
  cursor:pointer;
  transform:rotate(var(--r,0deg));
  transition:transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s, z-index 0s;
  z-index:1;
}
.collage-item img{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%);}
.collage-item:hover{
  transform:rotate(0deg) scale(1.15);
  box-shadow:0 16px 34px rgba(60,45,20,.38);
  z-index:40;
}
.collage-item.main{z-index:5;}
.collage-item.main:hover{z-index:41;}
.cover-text{padding-top:2px;position:relative;z-index:50;}
.cover-name{
  font-family:'Caveat','Zhi Mang Xing',cursive;
  font-size:clamp(2.75rem, 1.9rem + 3.2vw, 4rem);line-height:1;color:var(--ink);
  margin:0 0 6px;
}
/* name story bubble: empty bubble breathes; hover (desktop) / tap (mobile) pops the story */
.cover-name{position:relative;display:inline-block;}
.name-bubble{
  position:absolute;top:-10px;right:-46px;
  width:40px;height:34px;cursor:pointer;outline:none;
}
.nb-icon{display:block;width:100%;height:100%;transform-origin:15% 90%;position:relative;
  animation:bubbleBreathe 2.4s ease-in-out infinite;transition:transform .2s;}
/* soft halo that keeps radiating outward while idle */
.nb-icon::before,.nb-icon::after{
  content:'';position:absolute;left:4px;top:1px;width:34px;height:28px;border-radius:50%;
  border:1.5px solid rgba(201,168,92,.6);background:rgba(255,248,225,.3);
  animation:bubbleHalo 2.4s ease-out infinite;pointer-events:none;
}
.nb-icon::after{animation-delay:1.2s;}
@keyframes bubbleHalo{0%{transform:scale(.9);opacity:.8;}100%{transform:scale(1.9);opacity:0;}}
.nb-icon svg{width:100%;height:100%;overflow:visible;display:block;}
.name-bubble:focus-visible .nb-icon{filter:drop-shadow(0 0 3px #D6BD7C);}
@keyframes bubbleBreathe{0%,100%{transform:scale(.92) translateY(0);}50%{transform:scale(1.15) translateY(-2px);}}
.name-pop{
  position:absolute;left:14px;bottom:calc(100% + 12px);
  width:min(380px,78vw);padding:14px 16px 6px;
  background:#fff;border:1.5px solid #D2B574;border-radius:16px;
  box-shadow:0 10px 26px rgba(60,45,20,.18);
  font-family:'Times New Roman','Noto Serif SC',serif;
  font-size:0.8125rem;line-height:1.75;color:var(--ink);text-align:left;
  opacity:0;visibility:hidden;transform:translateY(6px) scale(.96);transform-origin:left bottom;
  transition:opacity .22s, transform .22s, visibility .22s;
  z-index:60;cursor:default;
}
.name-pop p{margin:0 0 8px;}
.name-pop b{color:var(--stamp);}
.name-bubble:hover .nb-icon,.name-bubble:focus .nb-icon,.name-bubble.open .nb-icon{animation:none;transform:scale(1.12) rotate(-4deg);}
.name-bubble:hover .nb-icon::before,.name-bubble:hover .nb-icon::after,.name-bubble:focus .nb-icon::before,.name-bubble:focus .nb-icon::after,.name-bubble.open .nb-icon::before,.name-bubble.open .nb-icon::after{animation:none;opacity:0;}
.name-bubble:hover .name-pop,.name-bubble:focus .name-pop,.name-bubble.open .name-pop{
  opacity:1;visibility:visible;transform:none;
}
.name-pop.below{bottom:auto;top:calc(100% + 44px);transform-origin:left top;}
@media(prefers-reduced-motion:reduce){.nb-icon,.nb-icon::before,.nb-icon::after{animation:none;}.nb-icon::before,.nb-icon::after{opacity:0;}}

.cover-tagline{
  font-size:1rem;color:var(--ink-soft);margin-bottom:20px;
  font-family:'Times New Roman','Noto Serif SC',serif;
}
.cover-meta{font-size:0.875rem;color:var(--ink-soft);line-height:2;margin-bottom:6px;}
.cover-meta b{color:var(--ink);font-weight:600;}
.cover-hint{
  margin-top:22px;color:var(--ink-soft);
  font-family:'Caveat','Zhi Mang Xing',cursive;font-size:1.1875rem;
  opacity:.85;
}

/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{
  content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;
  background:var(--rule);
}
.t-item{position:relative;margin-bottom:34px;}
.t-item::before{
  content:'';position:absolute;left:-26px;top:5px;
  width:12px;height:12px;border-radius:50%;
  background:var(--stamp);border:2px solid var(--white-page);
}
.t-date{
  font-family:'Caveat','Zhi Mang Xing',cursive;
  font-size:1.25rem;color:var(--stamp);margin-bottom:2px;
}
.t-title{font-size:1rem;font-weight:600;margin-bottom:4px;}
.t-role{font-size:0.8125rem;color:var(--ink-soft);margin-bottom:8px;}
.t-desc{font-size:0.8438rem;line-height:1.75;color:#3f3a30;max-width:66ch;}
.t-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:flex-start;}
.polaroid{
  background:#fff;padding:6px 6px 7px;
  box-shadow:0 4px 10px rgba(0,0,0,.14);
  width:96px;cursor:pointer;
  transform:rotate(var(--r,-2deg));
  transition:transform .2s;
}
.polaroid:hover{transform:rotate(0deg) scale(1.04);}
.polaroid img{width:100%;height:70px;object-fit:cover;display:block;}
.polaroid span{
  display:block;font-family:'Caveat','Zhi Mang Xing',cursive;
  font-size:0.75rem;text-align:center;margin-top:4px;color:var(--ink-soft);
}

/* two column generic */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:30px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}

.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.badge{
  font-size:0.75rem;padding:4px 10px;border-radius:999px;
  border:1px solid var(--rule);color:var(--ink-soft);
  background:var(--paper-2);
}

.skill-block h3{
  font-family:'Caveat','Zhi Mang Xing',cursive;font-size:1.375rem;
  color:var(--stamp);margin:0 0 8px;
}
.skill-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.skill-tag{
  font-size:0.7812rem;padding:5px 11px;border-radius:6px;
  background:var(--paper-2);color:var(--ink);
  border:1px solid var(--rule);
}

.contact-list{list-style:none;padding:0;margin:0 0 24px;}
.contact-list li{
  display:flex;gap:10px;align-items:center;
  font-size:0.9062rem;margin-bottom:12px;color:var(--ink);
}
.contact-list a{color:var(--stamp);text-decoration:none;border-bottom:1px dashed var(--stamp);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tape);flex:0 0 8px;}

.project-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.project-card{
  border:1px solid var(--rule);border-radius:10px;
  padding:14px 16px;background:var(--paper-2);
}
.project-card .pc-title{font-family:'Caveat','Zhi Mang Xing',cursive;font-size:1.25rem;color:var(--ink);margin-bottom:4px;}
.project-card .pc-desc{font-size:0.7812rem;color:var(--ink-soft);line-height:1.6;}
.project-card .pc-status{
  display:inline-block;margin-top:8px;font-size:0.6875rem;color:var(--stamp);
  border:1px solid var(--stamp);padding:2px 8px;border-radius:999px;
}

.note{
  font-family:'Caveat','Zhi Mang Xing',cursive;
  font-size:1rem;color:var(--ink-soft);
  transform:rotate(-1.5deg);margin-top:6px;
}

/* cover polaroids: washi tape on top */
.collage-item .tape{
  position:absolute;top:-9px;left:50%;width:46px;height:16px;
  transform:translateX(-50%) rotate(var(--tr,-4deg));
  background:rgba(201,184,150,.55);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 4px,transparent 4px 8px);
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
@media(max-width:820px){.collage-item .tape{width:30px;height:11px;top:-6px;}}

/* image fade-in: paper + text paint first, photos fade in when decoded */
img.fade{opacity:0;transition:opacity .45s ease;}
img.fade.loaded{opacity:1;}
.collage-item,.polaroid,.hobby-photo{background-color:#fff;}
.polaroid img,.collage-item img{background:var(--paper-2);}

/* inside the cabin overlay: the cabin supplies the language switch */
html.embedded .notebook-wrap{margin-bottom:24px;}

/* "back to the cabin" — only inside the cabin overlay */
.home-btn{display:none;align-items:center;gap:7px;height:36px;padding:0 16px 0 12px;border:none;border-radius:999px;
  background:var(--stamp);color:#fff;font-family:'Times New Roman','Noto Serif SC',serif;font-size:0.875rem;cursor:pointer;
  box-shadow:0 6px 16px -6px rgba(166,56,42,.7);transition:transform .15s, box-shadow .15s;white-space:nowrap;}
.home-btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px -8px rgba(166,56,42,.8);}
.home-btn svg{width:20px;height:20px;flex:0 0 20px;}
html.embedded .home-btn{display:inline-flex;}
@media(max-width:640px){
  html.embedded .home-btn{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;height:42px;padding:0 20px 0 14px;font-size:0.9375rem;}
  html.embedded .home-btn:hover{transform:translateX(-50%);}
  html.embedded footer{padding-bottom:84px;}
}

/* lightbox */
.lightbox{
  position:fixed;inset:0;background:rgba(30,25,15,.82);
  display:none;align-items:center;justify-content:center;
  z-index:999;padding:30px;
}
.lightbox.show{display:flex;}
.lightbox img{max-width:min(92vw,900px);max-height:86vh;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#fff;padding:8px;}
.lightbox-close{
  position:absolute;top:22px;right:30px;color:#fff;font-size:1.875rem;
  cursor:pointer;font-family:'Caveat','Zhi Mang Xing',cursive;
}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.6);
  background:rgba(0,0,0,.25);color:#fff;font-size:1.625rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.lb-nav:hover{background:rgba(255,255,255,.18);}
.lb-prev{left:18px;}
.lb-next{right:18px;}
.lb-count{position:absolute;top:26px;left:30px;color:#fff;font-size:0.875rem;letter-spacing:.05em;opacity:.85;}
.lightbox.single .lb-nav,.lightbox.single .lb-count{display:none;}
@media(max-width:820px){.lb-nav{width:38px;height:38px;font-size:1.375rem;}.lb-prev{left:8px;}.lb-next{right:8px;}}
.lightbox-download{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  color:#fff;font-size:0.875rem;border:1px solid #fff;padding:8px 18px;
  border-radius:999px;text-decoration:none;
}

footer{
  text-align:center;font-size:0.75rem;color:var(--ink-soft);
  padding:20px 16px 40px;line-height:1.7;overflow-wrap:anywhere;
}

@media(max-width:820px){
  .topbar{padding:14px 16px;gap:10px;}
  .brand{font-size:1.3rem;white-space:nowrap;}
  .notebook-wrap{flex-direction:column;padding:0 10px;}
  .spine{display:none;}
  .book{border-radius:14px;flex-direction:column;}
  .tabs{
    flex-direction:row;width:100%;padding:10px 10px 0;overflow-x:auto;
  }
  .tab{writing-mode:horizontal-tb;min-height:auto;border-radius:8px 8px 0 0;white-space:nowrap;padding:10px 14px;font-size:1rem;}
  .cover{flex-direction:column;}
  .pages-area{order:2;}
  .page{padding:26px 20px 30px;}
  .tabs{order:1;}
  .nav-btns{bottom:10px;}
}

/* hobbies page */
.hobbies-intro{font-size:0.875rem;color:var(--ink-soft);line-height:1.8;margin-bottom:22px;max-width:60ch;}
.hobby-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.hobby-photo{
  aspect-ratio:1/1;overflow:hidden;cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}
.hobby-photo img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.hobby-photo:hover img{transform:scale(1.08);}
.hobby-empty{
  font-family:'Caveat','Zhi Mang Xing',cursive;font-size:1.375rem;
  color:var(--ink-soft);opacity:.7;padding:30px 0;
}

/* page nav: tap-to-turn is handled in JS via click-position detection */
.nav-btns{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:14px;z-index:35;
}
.nav-btn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--rule);background:rgba(255,255,255,.7);
  color:var(--ink-soft);font-size:0.9375rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.nav-btn:hover{background:#fff;color:var(--stamp);}
.nav-btn[disabled]{opacity:.3;cursor:default;}
.nav-btn[disabled]:hover{background:rgba(255,255,255,.7);color:var(--ink-soft);}


/* === simple page transition (slide + tap zones) === */
.pages-area{
  flex:1;position:relative;overflow:hidden;
}
#pagesInner{position:relative;width:100%;height:100%;}
.page{
  position:absolute;inset:0;
  padding:44px 46px 40px;
  opacity:0;pointer-events:none;
  transform:translateX(18px);
  transition:opacity .35s ease, transform .4s ease;
  overflow:auto;
  background:var(--white-page);
}
.page.active{
  opacity:1;pointer-events:auto;
  position:relative;
  transform:translateX(0);
}
.page-num{
  font-family:'Caveat','Zhi Mang Xing',cursive;
  font-size:1.25rem;color:var(--stamp);
  position:absolute;top:18px;right:26px;
}
.page-nav-zone{
  position:absolute;top:0;bottom:0;width:26px;z-index:3;
  cursor:pointer;
}
.page-nav-zone.left{left:0;}
.page-nav-zone.right{right:0;}

</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brand">📓 Erxiao's Notebook</div>
  <div class="top-actions">
  <div class="fs-ctl">
    <button class="fs-btn" id="fsBtn" aria-expanded="false" aria-controls="fsPop" title="字号">Aa</button>

let lang = 'zh';

// image paths: thumbs (<=600px) on pages, full (<=1600px) in the lightbox
const fullSrc  = k => IMG_FILE[k] ? `assets/img/${IMG_FILE[k]}.webp` : '';
const thumbSrc = k => IMG_FILE[k] ? `assets/img/thumb/${IMG_FILE[k]}.webp` : '';
const onImgLoad = `onload="this.classList.add('loaded')"`;

// inactive pages keep data-lazy; the real src is set only when the page (or its neighbour) is shown
function hydrate(pageEl){
  if(!pageEl) return;
  pageEl.querySelectorAll('img[data-lazy]').forEach(img=>{
    img.src = img.dataset.lazy;
    img.removeAttribute('data-lazy');
  });
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function thumbsHtml(thumbs){
  if(!thumbs || !thumbs.length) return '';
  const rotations = [-3,2,-1.5,3,-2,1.5];
  let html = '<div class="t-thumbs">';
  thumbs.forEach((t,i)=>{
    const [key,label] = t;
    html += `<div class="polaroid" style="--r:${rotations[i%rotations.length]}deg" data-src="${fullSrc(key)}" data-label="${label}">
      <img class="fade" data-lazy="${thumbSrc(key)}" alt="${label}" decoding="async" ${onImgLoad}><span>${label}</span></div>`;
  });
  html += '</div>';
  return html;
}

const JADE_BUBBLE = `<svg viewBox="0 0 40 34" aria-hidden="true">
  <defs>
  <filter id="bubS" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#8a6d33" flood-opacity=".22"/></filter></defs>
  <path filter="url(#bubS)" fill="#fff" stroke="#D2B574" stroke-opacity=".85" stroke-width="1.3"
    d="M20 2C30.5 2 38 8 38 15.5S30.5 29 20 29c-2.2 0-4.3-.3-6.2-.8L6 32l2.2-6.3C4.4 23.2 2 19.6 2 15.5 2 8 9.5 2 20 2Z"/>
  
</svg>`;

const COLLAGE_LAYOUT = [
  {key:'photo1',              style:'left:0%;top:10%;--r:-5deg;--tr:-6deg;--pos:50% 60%;'},
  {key:'photo2',              style:'left:19%;top:0%;--r:4deg;--tr:5deg;--pos:49% 40%;'},
  {key:'证件照', main:true,  style:'left:38.5%;top:8%;--r:-2deg;--tr:-3deg;--pos:50% 20%;'},
  {key:'photo3',              style:'left:58%;top:1%;--r:5deg;--tr:4deg;--pos:52% 55%;'},
  {key:'photo6',              style:'left:77%;top:11%;--r:-4deg;--tr:-5deg;--pos:50% 30%;'}
];

function renderCover(container, d){
  const c = d;
  const collageHtml = COLLAGE_LAYOUT.map(item=>{
    return `<div class="collage-item${item.main?' main':''}" style="${item.style}" data-src="${fullSrc(item.key)}" data-label="${item.main? c.name : ''}">
      <span class="tape"></span>
      <img class="fade" src="${thumbSrc(item.key)}" alt="" decoding="async"${item.main?' fetchpriority="high"':''} ${onImgLoad}>
    </div>`;
  }).join('');
  container.innerHTML = `
    <div class="cover">
      <div class="cover-collage">${collageHtml}</div>
      <div class="cover-text">
        <div class="cover-name">${c.name}${c.nameStory?`<span class="name-bubble" tabindex="0" role="button" aria-label="名字的由来"><span class="nb-icon">${JADE_BUBBLE}</span><span class="name-pop">${c.nameStory}</span></span>`:''}</div>
        <div class="cover-tagline">${c.tagline}</div>
        <div class="cover-meta">
          ${c.meta.map(m=>`<div><b>${m[0]}：</b>${m[1]}</div>`).join('')}
        </div>
        <div class="cover-hint">${lang==='zh' ? '→ 点开右侧标签，翻阅完整经历' : '→ Flip through the tabs on the right'}</div>
      </div>
    </div>`;
  bindCollage();
  const nb = container.querySelector('.name-bubble');
  if(!nb) return;
  const pop = nb.querySelector('.name-pop');
  // keep the popup inside the page: clamp horizontally, flip below when there is no room above
  const place = ()=>{
    const page = nb.closest('.page').getBoundingClientRect();
    const b = nb.getBoundingClientRect();
    const w = Math.min(380, page.width - 32);
    pop.style.width = w + 'px';
    const left = Math.max(page.left + 16, Math.min(b.left + 14, page.right - 16 - w));
    pop.style.left = (left - b.left) + 'px';
    pop.classList.toggle('below', b.top - page.top < pop.offsetHeight + 24);
  };
  nb.addEventListener('mouseenter', place);
  nb.addEventListener('focus', place);
  nb.addEventListener('click', e=>{ e.stopPropagation(); place(); nb.classList.toggle('open'); });
}
document.addEventListener('click', ()=>document.querySelectorAll('.name-bubble.open').forEach(b=>b.classList.remove('open')));

function bindCollage(){
  const items = [...document.querySelectorAll('.collage-item')];
  const gallery = items.map(p=>({src:p.dataset.src, label:p.dataset.label}));
  items.forEach((p,i)=>p.addEventListener('click', ()=>openLightbox(gallery, i)));
}

function renderTimeline(container, d){
  let html = `<h1 class="page-title">${d.title}</h1><div class="page-sub">${d.sub}</div><div class="timeline">`;
  d.items.forEach(it=>{
    html += `<div class="t-item">
      <div class="t-date">${it.date}</div>
      <div class="t-title">${it.title}</div>
      <div class="t-role">${it.role}</div>
      <div class="t-desc">${it.desc}</div>
      ${thumbsHtml(it.thumbs)}
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

  html += '<div class="grid2"><div>';

function renderHobbies(container, d){
  let html = `<h1 class="page-title">${d.title}</h1><div class="page-sub">${d.sub}</div>`;
  html += `<div class="hobbies-intro">${d.intro}</div>`;
  if(d.gallery && d.gallery.length){
    html += '<div class="hobby-gallery">';
    d.gallery.forEach(g=>{
      html += `<div class="hobby-photo" data-src="${fullSrc(g[0])}" data-label="${g[1]||''}"><img class="fade" data-lazy="${thumbSrc(g[0])}" alt="${g[1]||''}" decoding="async" ${onImgLoad}></div>`;
    });
    html += '</div>';
  } else {
    html += `<div class="hobby-empty">${lang==='zh' ? '照片陆续整理中…' : 'Photos coming soon…'}</div>`;
  }
  container.innerHTML = html;
  const hp = [...container.querySelectorAll('.hobby-photo')];
  const gallery = hp.map(p=>({src:p.dataset.src, label:p.dataset.label||''}));
  hp.forEach((p,i)=>p.addEventListener('click', ()=>openLightbox(gallery, i)));
}


const RENDERERS = {
  cover: renderCover,
  education: renderTimeline,
  competitions: renderTimeline,
  internship: renderTimeline,
  campus: renderTimeline,
  hobbies: renderHobbies,
  portfolio: renderPortfolio,
  skills: renderSkills
};

const SECTION_KEYS = ['cover','education','competitions','internship','campus','hobbies','portfolio','skills'];
let activeIndex = 0;

function buildPages(){
  const area = document.getElementById('pagesInner');
  area.innerHTML = '';
  const d = DATA[lang];
  SECTION_KEYS.forEach((key,i)=>{
    const page = el('div','page'+(i===activeIndex?' active':''));
    page.dataset.index = i;
    page.dataset.key = key;
    const num = el('div','page-num', 'Page '+String(i+1).padStart(2,'0')+' / '+SECTION_KEYS.length);
    page.appendChild(num);
    const content = el('div','page-content');
    page.appendChild(content);
    area.appendChild(page);
    RENDERERS[key](content, key==='skills'? d : d[key]);
  });
  bindPolaroids();
}

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  DATA[lang].tabs.forEach((label,i)=>{
    const b = el('button','tab'+(i===activeIndex?' active':''), label);
    b.addEventListener('click', ()=>{ activeIndex=i; refresh(); });
    tabsEl.appendChild(b);
  });
}

function refresh(){
  buildTabs();
  document.querySelectorAll('.page').forEach(p=>{
    const i = Number(p.dataset.index);
    p.classList.toggle('active', i===activeIndex);
    if(Math.abs(i-activeIndex)<=1) hydrate(p);   // current page + neighbours, so flipping feels instant
  });
  const prevBtn = document.getElementById('navPrev');
  const nextBtn = document.getElementById('navNext');
  if(prevBtn) prevBtn.disabled = activeIndex === 0;
  if(nextBtn) nextBtn.disabled = activeIndex === SECTION_KEYS.length - 1;
}

function bindPolaroids(){
  document.querySelectorAll('.t-thumbs').forEach(row=>{
    const ps = [...row.querySelectorAll('.polaroid')];
    const gallery = ps.map(p=>({src:p.dataset.src, label:p.dataset.label}));
    ps.forEach((p,i)=>p.onclick = ()=>openLightbox(gallery, i));
  });
}

// ---- lightbox: the photos of one entry form a gallery (arrows / keys / swipe) ----
let lb = {items:[], i:0};
const lbOpen = ()=>document.getElementById('lightbox').classList.contains('show');
function openLightbox(items, i){
  lb = {items, i};
  document.getElementById('lightbox').classList.toggle('single', items.length < 2);
  showLb();
  document.getElementById('lightbox').classList.add('show');
}
function showLb(){
  const it = lb.items[lb.i];
  const img = document.getElementById('lightboxImg');
  img.style.transform = 'scale(1)'; img.dataset.scale = '1';
  img.src = it.src; img.alt = it.label;
  document.getElementById('lightboxDownload').href = it.src;
  document.getElementById('lightboxDownload').download = it.label || 'photo';
  document.getElementById('lightboxLabel').textContent = it.label;
  document.getElementById('lbCount').textContent = `${lb.i+1} / ${lb.items.length}`;
}
function stepLb(d){
  if(lb.items.length < 2) return;
  lb.i = (lb.i + d + lb.items.length) % lb.items.length;
  showLb();
}
function closeLb(){ document.getElementById('lightbox').classList.remove('show'); }

function setLang(l){
  lang = l;
  document.getElementById('langZh').classList.toggle('active', l==='zh');
  document.getElementById('langEn').classList.toggle('active', l==='en');
  document.documentElement.lang = (l==='zh'?'zh-CN':'en');
  document.getElementById('fsLbl').textContent = l==='zh' ? '字号' : 'Text size';
  document.getElementById('fsReset').textContent = l==='zh' ? '重置' : 'Reset';
  document.getElementById('fsBtn').title = l==='zh' ? '字号' : 'Text size';
  document.getElementById('homeLbl').textContent = l==='zh' ? '回到小屋' : 'Back to the cabin';
  if(window.parent!==window) parent.postMessage({type:'cabin-lang', lang:l}, '*');
  document.getElementById('brand').textContent = l==='zh' ? "📓 Erxiao's Notebook" : "📓 Gloria's Notebook";
  buildPages();
  refresh();
}

document.getElementById('langZh').addEventListener('click', ()=>setLang('zh'));
document.getElementById('langEn').addEventListener('click', ()=>setLang('en'));
document.getElementById('lightboxClose').addEventListener('click', closeLb);
document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') closeLb(); });
document.getElementById('lbPrev').addEventListener('click', e=>{ e.stopPropagation(); stepLb(-1); });
document.getElementById('lbNext').addEventListener('click', e=>{ e.stopPropagation(); stepLb(1); });
(function(){
  const box = document.getElementById('lightbox');
  let sx=null, sy=null;
  box.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  box.addEventListener('touchend', e=>{
    if(sx===null) return;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    const zoomed = (document.getElementById('lightboxImg').dataset.scale||'1') !== '1';
    if(!zoomed && Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3) stepLb(dx<0?1:-1);
  }, {passive:true});
})();

const QS = new URLSearchParams(location.search);
if(QS.get('embed')==='1') document.documentElement.classList.add('embedded');
document.getElementById('homeBtn').addEventListener('click', ()=>parent.postMessage({type:'cabin-close'}, '*'));
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && QS.get('embed')==='1' && !lbOpen()) parent.postMessage({type:'cabin-close'}, '*'); });
setLang(QS.get('lang')==='en' ? 'en' : 'zh');

// ---- Aa: reader-chosen text size (85%-130%), remembered on this device ----
(function(){
  const KEY = 'resume-font-scale';
  const btn = document.getElementById('fsBtn'), pop = document.getElementById('fsPop');
  const range = document.getElementById('fsRange'), val = document.getElementById('fsVal');
  function apply(pct, save){
    document.documentElement.style.setProperty('--fs', pct/100);
    range.value = pct; val.textContent = pct + '%';
    if(save){ try{ localStorage.setItem(KEY, String(pct)); }catch(e){} }
  }
  let saved = 100;
  try{ saved = Number(localStorage.getItem(KEY)) || 100; }catch(e){}
  apply(Math.min(130, Math.max(85, saved)), false);
  const toggle = open=>{ pop.hidden = !open; btn.setAttribute('aria-expanded', String(open)); };
  btn.addEventListener('click', e=>{ e.stopPropagation(); toggle(pop.hidden); });
  pop.addEventListener('click', e=>e.stopPropagation());
  document.addEventListener('click', ()=>toggle(false));
  range.addEventListener('input', ()=>apply(Number(range.value), true));
  document.getElementById('fsReset').addEventListener('click', ()=>apply(100, true));
})();

// once the cover is fully painted, quietly warm up the remaining pages' thumbnails
window.addEventListener('load', ()=>{
  const idle = window.requestIdleCallback || (fn=>setTimeout(fn, 1200));
  idle(()=>document.querySelectorAll('.page').forEach(hydrate));
});

// page navigation: nav buttons, edge tap zones, swipe, keyboard
function goToIndex(i){
  activeIndex = Math.max(0, Math.min(SECTION_KEYS.length - 1, i));
  refresh();
}
function nextPage(){ goToIndex(activeIndex + 1); }
function prevPage(){ goToIndex(activeIndex - 1); }

document.getElementById('navPrev').addEventListener('click', prevPage);
document.getElementById('navNext').addEventListener('click', nextPage);
document.getElementById('navZoneLeft').addEventListener('click', prevPage);
document.getElementById('navZoneRight').addEventListener('click', nextPage);

document.addEventListener('keydown', (e)=>{
  if(lbOpen()){
    if(e.key === 'ArrowLeft') stepLb(-1);
    if(e.key === 'ArrowRight') stepLb(1);
    if(e.key === 'Escape') closeLb();
    return;
  }
  if(e.key === 'ArrowLeft') prevPage();
  if(e.key === 'ArrowRight') nextPage();
});

(function(){
  const area = document.getElementById('pagesInner');
  let touchStartX = null, touchStartY = null;
  area.addEventListener('touchstart', (e)=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  area.addEventListener('touchend', (e)=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) nextPage(); else prevPage();
    }
    touchStartX = null;
  }, {passive:true});
})();

// lightbox zoom (click to zoom toggle + wheel zoom, centered on cursor)
(function(){
  const img = document.getElementById('lightboxImg');
  if(!img) return;
  let scale = 1;
  img.style.transition = 'transform .18s ease';
  img.style.cursor = 'zoom-in';

  function setOrigin(e){
    const rect = img.getBoundingClientRect();
    const ox = ((e.clientX - rect.left) / rect.width) * 100;
    const oy = ((e.clientY - rect.top) / rect.height) * 100;
    img.style.transformOrigin = `${ox}% ${oy}%`;
  }
  function apply(){
    img.dataset.scale = String(scale);
    img.style.transform = `scale(${scale})`;
    img.style.cursor = scale > 1 ? 'zoom-out' : 'zoom-in';
  }
  img.addEventListener('load', ()=>{ scale = 1; img.style.cursor = 'zoom-in'; });
  img.addEventListener('click', (e)=>{
    setOrigin(e);
    scale = scale > 1 ? 1 : 2.6;
    apply();
  });
  img.addEventListener('wheel', (e)=>{
    e.preventDefault();
    setOrigin(e);
    scale += (e.deltaY < 0 ? 0.35 : -0.35);
    scale = Math.max(1, Math.min(5, scale));
    apply();
  }, {passive:false});
  document.getElementById('lightboxClose').addEventListener('click', ()=>{ scale=1; img.style.transform='scale(1)'; });
  document.getElementById('lightbox').addEventListener('click', (e)=>{
    if(e.target.id==='lightbox'){ scale=1; img.style.transform='scale(1)'; }
  });
})();
